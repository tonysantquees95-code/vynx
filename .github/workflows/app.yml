name: App (interface e Windows)

# Verifica a interface, gera o instalador do Windows (Tauri) e publica uma release "1.N" com VynxSetup.exe.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: app
      - run: npm run test && npm run typecheck && npm run build
        working-directory: app
        env:
          VITE_BUILD: ${{ github.run_number }}
      - name: Teste visual (telas em vários tamanhos)
        run: npm run test:visual
        working-directory: app
        env:
          CHROME: C:/Program Files/Google/Chrome/Application/chrome.exe
      - name: Guardar as fotos das telas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fotos-das-telas
          path: app/teste-visual/fotos/
          retention-days: 7

  windows:
    needs: verificar
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm install --no-audit --no-fund
        working-directory: app
      - name: Instalar o Tauri e gerar os ícones
        run: |
          npm install -g @tauri-apps/cli@2
          cd desktop/src-tauri
          tauri icon ../app-icon.png
      - name: Testar a parte Rust
        run: cargo test -p vynx-desktop
      - name: Gerar o instalador
        working-directory: desktop/src-tauri
        run: tauri build
        env:
          VITE_BUILD: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: vynx-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publicar:
    needs: windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vynx-windows
          path: pacote
      - name: Publicar a versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$(ls pacote/*.exe | head -n 1)" pacote/VynxSetup.exe
          gh release create "1.${{ github.run_number }}" pacote/VynxSetup.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Vynx OS 1.${{ github.run_number }}" --notes "VynxSetup.exe (Windows)."
